name: CI for Tests and Package Publishing

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Install dependencies
        run: uv sync --frozen --python 3.12

      - name: Run pre-commit hooks
        run: uv run --frozen --python 3.12 pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            tox-env: py39-django42
          - python-version: "3.10"
            tox-env: py310-django42
          - python-version: "3.10"
            tox-env: py310-django52
          - python-version: "3.11"
            tox-env: py311-django42
          - python-version: "3.11"
            tox-env: py311-django52
          - python-version: "3.12"
            tox-env: py312-django42
          - python-version: "3.12"
            tox-env: py312-django50
          - python-version: "3.12"
            tox-env: py312-django51
          - python-version: "3.12"
            tox-env: py312-django52
          - python-version: "3.12"
            tox-env: py312-django60
          - python-version: "3.12"
            tox-env: py312-django61
          - python-version: "3.13"
            tox-env: py313-django52
          - python-version: "3.13"
            tox-env: py313-django61
          - python-version: "3.14"
            tox-env: py314-django52
          - python-version: "3.14"
            tox-env: py314-django61

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --frozen --python ${{ matrix.python-version }} tox -e ${{ matrix.tox-env }}

      - name: Upload to Codecov
        if: success() && matrix.tox-env == 'py314-django61' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: true
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.tox-env == 'py314-django61' && github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results
          fail_ci_if_error: true

      - name: Upload HTML coverage report
        if: ${{ !cancelled() && matrix.tox-env == 'py314-django61' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/

  publish:
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'release'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Build and publish package
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uv build --python 3.12
          uv publish
