name: CI for Tests and Package Publishing

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          uv pip install --system -e .
          uv pip install --system pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            tox-env: py39-django42
          - python-version: "3.10"
            tox-env: py310-django42
          - python-version: "3.10"
            tox-env: py310-django52
          - python-version: "3.11"
            tox-env: py311-django42
          - python-version: "3.11"
            tox-env: py311-django52
          - python-version: "3.12"
            tox-env: py312-django42
          - python-version: "3.12"
            tox-env: py312-django50
          - python-version: "3.12"
            tox-env: py312-django51
          - python-version: "3.12"
            tox-env: py312-django52

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install tox
        run: uv pip install --system tox

      - name: Run tests
        run: tox -e ${{ matrix.tox-env }}

      - name: Upload to Codecov
        if: success() && matrix.tox-env == 'py312-django52' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: true
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.tox-env == 'py312-django52' && github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results
          fail_ci_if_error: true

      - name: Upload HTML coverage report
        if: ${{ !cancelled() && matrix.tox-env == 'py312-django52' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  publish:
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'release'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install build dependencies
        run: uv pip install --system build twine

      - name: Build package
        run: python -m build

      - name: Publish package
        run: twine upload dist/* --username __token__ --password ${{ secrets.PYPI_API_TOKEN }}
