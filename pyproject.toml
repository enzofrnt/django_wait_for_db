[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
  "bandit[toml]>=1.7.9,<2",
  "black>=24.4.2,<25",
  "codecov>=2.1.13,<3",
  "django-stubs>=5.0.4,<6",
  "isort>=5.13.2,<6",
  "mypy>=1.11.1,<2",
  "pre-commit>=3.5.0,<4",
  "pylint>=3.2.6,<4",
  "pylint-pytest>=1.1.8,<2",
  "pytest==8.3.5",
  "pytest-cov>=5.0.0,<6",
  "pytest-django>=4.8.0,<5",
  "python-semantic-release>=9.8.8,<11.0.0",
  "tox>=4.16.0,<5",
]

[project]
name = "django-wait-for-db"
version = "1.0.6"
description = "Simple Django app that provides a simple command to wait for the database to be ready before starting the server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "enzo_frnt" }]
keywords = ["database", "django and docker", "django database", "wait for db"]
requires-python = ">=3.8,<4.0"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "django>=4.2,<6.2; python_version>='3.12'",
  "django>=4.2,<6; python_version>='3.10' and python_version<'3.12'",
  "django>=4.2,<5; python_version>='3.8' and python_version<'3.10'",
]

[project.urls]
Documentation = "https://github.com/enzofrnt/django_wait_for_db/blob/main/README.md"
Issues = "https://github.com/enzofrnt/django_wait_for_db/issues"
"Source Code" = "https://github.com/enzofrnt/django_wait_for_db"

[tool.bandit]
targets = ["./wait_for_db"]
exclude_dirs = ["tests", "migrations"]
severity = "medium"
confidence = "medium"
max_lines = 500
progress = true
reports = true
output_format = "screen"
output_file = "bandit_report.txt"
include = ["B101", "B102"]
exclude_tests = ["B301", "B302"]

[tool.bandit.plugins]
B104 = { check_typed_list = true }

[tool.black]
line-length = 88
exclude = '''
/(
    \.git
  | \.venv
  | \.tox
  | build
  | dist
  | migrations
  | venv
  | env
  | __pycache__
  | node_modules
  | env
  | kernel
  | \.mypy_cache
  | \.pytest_cache
  | .*\.egg-info
)/
'''

[tool.hatch.build.targets.wheel]
packages = ["wait_for_db"]

[tool.isort]
profile = "black"
line_length = 88
skip = [
  "venv",
  ".venv",
  ".tox",
  "build",
  "dist",
  ".git",
  "__pycache__",
  "*.egg-info",
  ".mypy_cache",
  ".pytest_cache",
  "migrations",
  "node_modules",
  "env",
  "kernel",
]

[tool.pylint]
disable = [
  "C0103", # Invalid constant name
  "C0114", # Missing module docstring
  "C0115", # Missing class docstring
  "C0116", # Missing function or method docstring
  "E1101", # Instance of 'Foo' has no 'bar' member
  "W0212", # Access to a protected member
  "C0301", # Line too long
  "C0411", # Wrong import order
  "W0611", # Unused imports
  "W0613", # Unused arguments
  "W0622", # Redefining built-in names
  "R0903", # Too few public methods
  "R0801", # Duplicate code
  "W0621",
  "C0415",
  "R1719", # The if expression can be replaced with 'bool(test)'
  "R1705", # Unnecessary "elif" after "return"
  "R0401",
]
max-line-length = 88
ignore = [
  "tests",
  "migrations/*",
  "venv/*",
  "build/*",
  "dist/*",
  ".git/*",
  ".tox/*",
  "__pycache__/*",
  "*.egg-info/*",
  ".mypy_cache/*",
  ".pytest_cache/*",
]
load-plugins = ["pylint_pytest"]

suggestion-mode = true
const-rgx = "([A-Z_][A-Z0-9_]*)|(__.*__)"
attr-rgx = "[a-z_][a-z0-9_]{2,30}$"
variable-rgx = "[a-z_][a-z0-9_]{2,30}$"
argument-rgx = "[a-z_][a-z0-9_]{2,30}$"
method-rgx = "[a-z_][a-z0-9_]{2,30}$"
function-rgx = "[a-z_][a-z0-9_]{2,30}$"
class-rgx = "[A-Z_][a-zA-Z0-9]+$"
module-rgx = "(([a-z_][a-z0-9_]*)|(__.*__))$"

[tool.semantic_release]
build_command = "uv build"
version_toml = ["pyproject.toml:project.version"]
