[tox]
requires =
    tox>=4.2
env_list =
    py312-django42
    py312-django50
    py312-django51
    py312-django52
    py311-django42
    py311-django52
    py310-django42
    py310-django52
    py39-django42

[testenv]
package = editable
deps =
    pytest-cov
    py310: pytest
    py310: pytest-django
    py311: pytest
    py311: pytest-django
    py312: pytest
    py312: pytest-django
    py39: pytest<9,>=8.2
    py39: pytest-django<4.12,>=4.8
commands_pre =
    django42: python -m pip install "Django>=4.2,<4.3"
    django50: python -m pip install "Django>=5.0,<5.1"
    django51: python -m pip install "Django>=5.1,<5.2"
    django52: python -m pip install "Django>=5.2,<5.3"
commands =
    pytest --cov=wait_for_db --cov-report=html --cov-report=xml --junitxml=junit.xml -o junit_family=legacy
